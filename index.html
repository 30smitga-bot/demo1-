<!DOCTYPE html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script>
    </head>
    <body>
        <a-scene>
            <a-camera>
                <a-cursor></a-cursor>
            </a-camera>
        <a-box
            position="-5 1 -50"
            depth="2"
            height="2"
            width="2"
            animation="
                property: position;
                from: -5 0 -50;
                to: -5 0 -5;
                dur: 2000;
                easing: linear;
                loop: true;
                dir: alternate; 
                dur: 2000;
                startEvents: click;
            "
            color="green">
            </a-box>
        
        <a-sphere
        position="2 1 -5"
            depth="2"
            height="2"
            width="2"
            color="purple"
            animation="
                property: position;
                from: 2 1 -5;
                to: 2 5 -5;
                loop: true;
                dir: alternate;
                dur: 1800;
                startEvents: click;
                ">
            </a-sphere>
            
            <a-torus 
            position="6 7 -6" 
            color="purple" 
            radius="1.2" 
            radius-tubular="0.15"
        animation="
        property: rotation; 
        to: 360 360 360; 
        loop: true; 
        dur: 2000;
        startEvents: click;
        ">
    </a-torus>
            
        </a-scene>
    </body>
</html>
